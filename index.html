  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body,#root{height:100%;width:100%;overflow:hidden}
    body{background:#020b18;color:#e2e8f0;font-family:'Courier New',Consolas,monospace}
    ::-webkit-scrollbar{width:4px;height:4px}
    ::-webkit-scrollbar-track{background:#020b18}
    ::-webkit-scrollbar-thumb{background:#1e3a5f;border-radius:2px}
    input,button{font-family:inherit}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:0.4}}
    @keyframes slideIn{from{transform:translateX(40px);opacity:0}to{transform:translateX(0);opacity:1}}
    @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .notif{animation:slideIn 0.3s ease}
    .fadeIn{animation:fadeIn 0.2s ease}
    .navbtn:hover{background:#0c1f35!important;color:#e2e8f0!important}
    .groupbtn:hover{border-color:#38bdf850!important}
    .addbtn:hover{background:#0c1f35!important}
    .gcard{transition:all 0.15s!important}
    .gcard:hover{border-color:#38bdf840!important;transform:translateY(-2px)!important}
    .sug:hover{background:#0c1f35!important;cursor:pointer}
    .strow:hover td{background:rgba(12,31,53,0.5)!important}
    input::placeholder{color:#334155}
    input:focus{outline:none;border-color:#38bdf860!important;box-shadow:0 0 0 2px #38bdf815}
    button:active{opacity:0.8}
    .delBtn:hover{color:#ef4444!important}
    @supports(padding-bottom:env(safe-area-inset-bottom)){
      .main-content{padding-bottom:calc(16px + env(safe-area-inset-bottom))!important}
    }
    @media(max-width:640px){
      .sidebar{width:0!important;overflow:hidden!important;padding:0!important}
      .sidebar.open{width:210px!important;overflow:auto!important;padding:14px 10px!important;
        position:fixed!important;left:0!important;top:0!important;bottom:0!important;
        z-index:50!important;background:#030d1c!important}
      .mktstrip{display:none!important}
    }
  </style>
</head>

// ═══════════════════════════════════════════════════════════════════
// REAL PRICE FETCHER — Multi-source with CORS proxy fallback chain
// ═══════════════════════════════════════════════════════════════════

// Convert NSE symbol → Yahoo Finance ticker
function toYF(sym) {
  if (sym === "NIFTY50")    return "%5ENSEI";
  if (sym === "BANKNIFTY")  return "%5ENSEBANK";
  if (sym === "M&M")        return "M%26M.NS";
  if (sym === "BAJAJ-AUTO") return "BAJAJ-AUTO.NS";
  return sym + ".NS";
}

// CORS proxy list — tried in order until one works
const PROXIES = [
  // allorigins — wraps any URL, returns JSON with contents field
  url => `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`,
  // corsproxy.io
  url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
  // thingproxy
  url => `https://thingproxy.freeboard.io/fetch/${url}`,
];

// Yahoo Finance v8 chart endpoint — most reliable source
const YF_URL = sym =>
  `https://query1.finance.yahoo.com/v8/finance/chart/${toYF(sym)}?interval=1m&range=1d`;
const YF_URL2 = sym =>
  `https://query2.finance.yahoo.com/v8/finance/chart/${toYF(sym)}?interval=1m&range=1d`;

// Extract price from Yahoo Finance JSON response
function parseYF(json) {
  try {
    // allorigins wraps in {contents: "..."}
    const data = typeof json.contents === "string" ? JSON.parse(json.contents) : json;
    const meta = data?.chart?.result?.[0]?.meta;
    if (meta?.regularMarketPrice) return parseFloat(meta.regularMarketPrice.toFixed(2));
  } catch {}
  return null;
}

// Fetch one symbol — tries direct then proxies
async function fetchOne(sym) {
  const urls = [YF_URL(sym), YF_URL2(sym)];

  // 1. Try direct (works when CORS is allowed — e.g. Netlify hosted)
  for (const url of urls) {
    try {
      const r = await fetch(url, {
        headers: { "Accept": "application/json" },
        signal: AbortSignal.timeout(6000),
      });
      if (r.ok) {
        const json = await r.json();
        const p = parseYF(json);
        if (p) return { price: p, src: "direct" };
      }
    } catch {}
  }

  // 2. Try via CORS proxies
  for (const proxy of PROXIES) {
    for (const yUrl of urls) {
      try {
        const proxyUrl = proxy(yUrl);
        const r = await fetch(proxyUrl, { signal: AbortSignal.timeout(8000) });
        if (!r.ok) continue;
        const json = await r.json();
        const p = parseYF(json);
        if (p) return { price: p, src: "proxy" };
      } catch {}
    }
  }

  return null; // all sources failed
}

// Batch fetch — parallel groups of 3 to avoid throttling
async function fetchBatch(symbols) {
  const results = {};
  const BATCH = 3;
  for (let i = 0; i < symbols.length; i += BATCH) {
    const slice = symbols.slice(i, i + BATCH);
    const settled = await Promise.allSettled(slice.map(sym => fetchOne(sym)));
    settled.forEach((r, idx) => {
      if (r.status === "fulfilled" && r.value) {
        results[slice[idx]] = r.value.price;
      }
    });
    // Small delay to avoid rate limiting
    if (i + BATCH < symbols.length) await new Promise(res => setTimeout(res, 300));
  }
  return results;
}

// ── Helpers ───────────────────────────────────────────────────────
const uid    = () => Math.random().toString(36).slice(2, 9);
const fmtN   = n => new Intl.NumberFormat("en-IN", { maximumFractionDigits:2, minimumFractionDigits:2 }).format(n);
const fmtRs  = n => `₹${fmtN(n)}`;
const fmtPct = n => `${n >= 0 ? "+" : ""}${n.toFixed(2)}%`;
const now    = () => new Date().toISOString();

function calcStatus(stock, prices) {
  if (stock.stopped) {
    const c = stock.stoppedReason?.includes("SL") ? "#ef4444"
      : stock.stoppedReason?.includes("T3") ? "#a855f7"
      : stock.stoppedReason?.includes("T2") ? "#3b82f6" : "#22c55e";
    const sp = stock.stoppedPrice ?? stock.entryPrice;
    return { status:stock.stoppedReason, curr:sp, pnl:(sp-stock.entryPrice)*stock.qty, pct:((sp-stock.entryPrice)/stock.entryPrice)*100, color:c };
  }
  const curr = prices[stock.symbol] ?? stock.entryPrice;
  const pnl  = (curr - stock.entryPrice) * stock.qty;
  const pct  = ((curr - stock.entryPrice) / stock.entryPrice) * 100;
  if (stock.stopLoss && curr <= stock.stopLoss) return { status:"SL Hit", curr, pnl, pct, color:"#ef4444", trigger:"sl" };
  if (stock.t3 && curr >= stock.t3)             return { status:"T3 ✓",   curr, pnl, pct, color:"#a855f7", trigger:"t3" };
  if (stock.t2 && curr >= stock.t2)             return { status:"T2 ✓",   curr, pnl, pct, color:"#3b82f6", trigger:"t2" };
  if (stock.t1 && curr >= stock.t1)             return { status:"T1 ✓",   curr, pnl, pct, color:"#22c55e", trigger:"t1" };
  return { status:"Active", curr, pnl, pct, color:"#38bdf8", trigger:null };
}

// ── localStorage ──────────────────────────────────────────────────
const LS = { G:"nse_g_v6", P:"nse_p_v6", V:"nse_v_v6" };
const lsGet = k => { try { const v=localStorage.getItem(k); return v?JSON.parse(v):null; } catch { return null; } };
const lsSet = (k,v) => { try { localStorage.setItem(k,JSON.stringify(v)); } catch {} };

// ═══════════════════════════════════════════════════════════════════
//  ROOT APP
// ═══════════════════════════════════════════════════════════════════
function App() {
  const [groups,    setGroups]    = useState(() => lsGet(LS.G) || []);
  const [prices,    setPrices]    = useState(() => {
    const cached = lsGet(LS.P);
    return { ...SEED, ...(cached && Date.now()-cached.ts < 300000 ? cached.d : {}) };
  });
  const [pStat,     setPStat]     = useState("idle");
  const [lastUp,    setLastUp]    = useState(null);
  const [fetchLog,  setFetchLog]  = useState("");
  const [activeGid, setActiveGid] = useState(() => lsGet(LS.V)?.g || null);
  const [view,      setView]      = useState(() => lsGet(LS.V)?.v || "dashboard");
  const [modal,     setModal]     = useState(null);
  const [notif,     setNotif]     = useState(null);
  const [sideOpen,  setSideOpen]  = useState(false);
  const gRef = useRef(groups); gRef.current = groups;
  const pRef = useRef(prices); pRef.current = prices;

  useEffect(() => { lsSet(LS.G, groups); }, [groups]);
  useEffect(() => { lsSet(LS.V, { g:activeGid, v:view }); }, [activeGid, view]);

  const fetchPrices = useCallback(async () => {
    const syms = [...new Set([
      ...gRef.current.flatMap(g => g.stocks.map(s => s.symbol)),
      "RELIANCE","TCS","HDFCBANK","SBIN","ICICIBANK","TATAMOTORS","ITC","NIFTY50","BANKNIFTY"
    ])];
    setPStat("fetching");
    setFetchLog(`Fetching ${syms.length} prices…`);

    const fresh = await fetchBatch(syms);
    const count = Object.keys(fresh).length;

    if (count > 0) {
      setPrices(prev => {
        const next = { ...prev, ...fresh };
        lsSet(LS.P, { d:next, ts:Date.now() });
        return next;
      });
      setLastUp(new Date());
      setPStat("ok");
      setFetchLog(`✓ ${count}/${syms.length} prices live`);

      // Auto-stop stocks that hit SL or final target
      setGroups(prev => prev.map(g => ({
        ...g,
        stocks: g.stocks.map(s => {
          if (s.stopped) return s;
          const curr = fresh[s.symbol] ?? pRef.current[s.symbol] ?? s.entryPrice;
          if (s.stopLoss && curr <= s.stopLoss)
            return { ...s, stopped:true, stoppedReason:"SL Hit", stoppedPrice:curr };
          const ft = s.t3 || s.t2 || s.t1;
          if (ft && curr >= ft) {
            const r = s.t3&&curr>=s.t3 ? "T3 ✓" : s.t2&&curr>=s.t2 ? "T2 ✓" : "T1 ✓";
            return { ...s, stopped:true, stoppedReason:r, stoppedPrice:curr };
          }
          return s;
        })
      })));
    } else {
      setPStat("error");
      setFetchLog("✕ All sources blocked. Check connection.");
    }
  }, []);

  useEffect(() => {
    fetchPrices();
    const t = setInterval(fetchPrices, 60000);
    return () => clearInterval(t);
  }, []);

  const toast = (msg, type="ok") => {
    setNotif({ msg, type });
    setTimeout(() => setNotif(null), 2800);
  };
  const go = (gid, v) => { setActiveGid(gid); setView(v); setSideOpen(false); };

  const addGroup = ({ name, budget }) => {
    const g = { id:uid(), name, budget:parseFloat(budget)||50000, stocks:[], createdAt:now() };
    setGroups(p => [...p, g]); go(g.id, "group"); setModal(null); toast(`"${name}" created`);
  };
  const delGroup = id => {
    const g = groups.find(x => x.id===id);
    setGroups(p => p.filter(x => x.id!==id));
    if (activeGid===id) go(null, "dashboard");
    toast(`Deleted "${g?.name}"`, "err");
  };
  const addStock = (gid, data) => {
    const grp  = groups.find(g => g.id===gid);
    const entry = data.entryPrice > 0 ? data.entryPrice : (prices[data.symbol] ?? SEED[data.symbol] ?? 100);
    const qty   = Math.max(1, Math.floor(grp.budget / entry));
    setGroups(p => p.map(g => g.id!==gid ? g : {
      ...g, stocks: [...g.stocks, { id:uid(), ...data, entryPrice:entry, qty, addedAt:now(), stopped:false, stoppedReason:null, stoppedPrice:null }]
    }));
    setModal(null); toast(`${data.symbol} added`);
  };
  const delStock = (gid, sid) => {
    const stk = groups.find(g=>g.id===gid)?.stocks.find(s=>s.id===sid);
    setGroups(p => p.map(g => g.id!==gid ? g : { ...g, stocks:g.stocks.filter(s=>s.id!==sid) }));
    toast(`${stk?.symbol} removed`, "err");
  };

  const activeGroup = groups.find(g => g.id===activeGid);
  const statColor   = { idle:"#64748b", fetching:"#f59e0b", ok:"#22c55e", error:"#ef4444" }[pStat];

  return (
    <div style={{ height:"100vh", display:"flex", flexDirection:"column", overflow:"hidden", background:"#020b18" }}>
      {notif && <div className="notif" style={{ position:"fixed",top:14,right:14,zIndex:999,padding:"10px 16px",borderRadius:8,border:"1px solid",fontWeight:700,fontSize:13,background:notif.type==="err"?"#1a0808":"#081a0e",borderColor:notif.type==="err"?"#ef4444":"#22c55e",color:notif.type==="err"?"#ef4444":"#22c55e" }}>{notif.type==="err"?"✕":"✓"} {notif.msg}</div>}
      {sideOpen && <div onClick={()=>setSideOpen(false)} style={{ position:"fixed",inset:0,background:"rgba(0,0,0,0.6)",zIndex:48 }}/>}

      {/* ── Header ── */}
      <header style={{ display:"flex",alignItems:"center",gap:8,padding:"10px 12px",background:"#030d1c",borderBottom:"1px solid #0a1e36",flexShrink:0 }}>
        <button onClick={()=>setSideOpen(o=>!o)} style={{ background:"transparent",border:"none",color:"#38bdf8",fontSize:20,cursor:"pointer",padding:"0 4px",flexShrink:0 }}>☰</button>
        <span style={{ color:"#38bdf8",fontSize:16,fontWeight:900,flexShrink:0 }}>▲</span>
        <div style={{ flexShrink:0 }}>
          <div style={{ fontSize:13,fontWeight:800,color:"#38bdf8",letterSpacing:"0.05em",lineHeight:1 }}>NSE Paper Trader</div>
          <div style={{ fontSize:8,color:"#334155",letterSpacing:"0.1em",textTransform:"uppercase" }}>Nifty 300 · Real Prices</div>
        </div>

        {/* Market strip */}
        <div className="mktstrip" style={{ display:"flex",flex:1,overflowX:"auto",gap:0,minWidth:0 }}>
          {["NIFTY50","BANKNIFTY","RELIANCE","TCS","SBIN","HDFCBANK","ITC","TATAMOTORS"].map(sym => {
            const curr = prices[sym] || SEED[sym] || 0;
            const seed = SEED[sym] || curr;
            const chg  = seed ? ((curr-seed)/seed*100) : 0;
            const live = !!prices[sym] && prices[sym] !== SEED[sym];
            return (
              <div key={sym} style={{ display:"flex",alignItems:"center",gap:4,padding:"2px 8px",borderRight:"1px solid #0a1e36",flexShrink:0,fontSize:10 }}>
                <span style={{ color:"#475569",fontWeight:700 }}>{sym}</span>
                <span style={{ color: live ? "#e2e8f0" : "#475569", fontWeight:600 }}>{fmtRs(curr)}</span>
                <span style={{ color:chg>=0?"#22c55e":"#ef4444" }}>{fmtPct(chg)}</span>
              </div>
            );
          })}
        </div>

        {/* Price status */}
        <div style={{ display:"flex",flexDirection:"column",alignItems:"flex-end",gap:2,flexShrink:0 }}>
          <div style={{ display:"flex",alignItems:"center",gap:5 }}>
            <span style={{ fontSize:10,fontWeight:700,padding:"3px 8px",borderRadius:4,color:statColor,background:`${statColor}15`,border:`1px solid ${statColor}40` }}>
              <span style={{ display:"inline-block",width:6,height:6,borderRadius:"50%",background:statColor,marginRight:4,animation:pStat==="fetching"?"pulse 0.8s ease infinite":"none",verticalAlign:"middle" }}/>
              {pStat==="ok"?"LIVE":pStat==="fetching"?"…":"OFF"}
            </span>
            <button onClick={fetchPrices} title="Refresh prices" style={{ background:"transparent",border:"1px solid #1e3a5f",color:"#38bdf8",padding:"3px 8px",borderRadius:4,cursor:"pointer",fontSize:13 }}>↻</button>
          </div>
          {lastUp && <span style={{ fontSize:9,color:"#334155" }}>{lastUp.toLocaleTimeString("en-IN")}</span>}
          {fetchLog && <span style={{ fontSize:9,color:"#334155",maxWidth:160,textAlign:"right" }}>{fetchLog}</span>}
        </div>
      </header>

      {/* ── Layout ── */}
      <div style={{ display:"flex",flex:1,overflow:"hidden" }}>
        {/* Sidebar */}
        <aside className={`sidebar${sideOpen?" open":""}`} style={{ width:210,background:"#030d1c",borderRight:"1px solid #0a1e36",padding:"14px 10px",display:"flex",flexDirection:"column",gap:4,overflowY:"auto",flexShrink:0,zIndex:49 }}>
          <button className="navbtn" onClick={()=>go(null,"dashboard")} style={{ background:view==="dashboard"&&!activeGid?"#0c1f35":"transparent",border:"none",color:view==="dashboard"&&!activeGid?"#e2e8f0":"#64748b",padding:"9px 12px",borderRadius:6,cursor:"pointer",textAlign:"left",display:"flex",gap:8,alignItems:"center",fontSize:12,width:"100%" }}>⊞ Dashboard</button>
          <div style={{ fontSize:9,color:"#1e3a5f",letterSpacing:"0.15em",padding:"10px 4px 4px",fontWeight:700 }}>GROUPS ({groups.length})</div>
          {groups.map(g => {
            const gP = g.stocks.reduce((s,sk) => s+calcStatus(sk,prices).pnl, 0);
            const isA = activeGid===g.id && view==="group";
            return (
              <button key={g.id} className="groupbtn" onClick={()=>go(g.id,"group")} style={{ background:isA?"#0c1f35":"transparent",border:`1px solid ${isA?"#38bdf8":"#0a1e36"}`,color:isA?"#e2e8f0":"#94a3b8",padding:"8px 10px",borderRadius:6,cursor:"pointer",textAlign:"left",fontSize:12,display:"flex",flexDirection:"column",gap:1,width:"100%",transition:"all 0.15s" }}>
                <div style={{ fontWeight:700,color:isA?"#e2e8f0":"#cbd5e1",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis" }}>{g.name}</div>
                <div style={{ fontSize:10,color:gP>=0?"#22c55e":"#ef4444" }}>{gP>=0?"▲":"▼"} {fmtRs(Math.abs(gP))}</div>
                <div style={{ fontSize:10,color:"#334155" }}>{g.stocks.length} stocks</div>
              </button>
            );
          })}
          <button className="addbtn" onClick={()=>setModal("addGroup")} style={{ background:"transparent",border:"1px dashed #1e3a5f",color:"#38bdf8",padding:"8px 10px",borderRadius:6,cursor:"pointer",textAlign:"left",fontSize:12,display:"flex",gap:6,alignItems:"center",marginTop:6,width:"100%" }}>+ New Group</button>

          {/* Debug info at bottom of sidebar */}
          <div style={{ marginTop:"auto",padding:"8px 4px",fontSize:9,color:"#1e3a5f",lineHeight:1.6,borderTop:"1px solid #0a1e36" }}>
            <div>Prices fetched: {Object.keys(prices).filter(k=>prices[k]!==SEED[k]).length}</div>
            <div>Source: Yahoo Finance</div>
            <div>Via CORS proxy chain</div>
          </div>
        </aside>

        {/* Main */}
        <main className="main-content" style={{ flex:1,padding:"16px",overflowY:"auto" }}>
          {view==="dashboard" && <Dashboard groups={groups} prices={prices} go={go} setModal={setModal} pStat={pStat} fetchPrices={fetchPrices}/>}
          {view==="group" && activeGroup && (
            <GroupView group={activeGroup} prices={prices}

              onDelStock={sid => delStock(activeGroup.id, sid)}

      {modal==="addGroup" && <AddGroupModal onAdd={addGroup} onClose={()=>setModal(null)}/>}

function GroupView({ group, prices, onAddStock, onDelGroup, onDelStock }) {
  const [confirm, setConfirm] = useState(null);
  const inv = group.stocks.reduce((s,sk)=>s+sk.entryPrice*sk.qty,0);
  const pnl = group.stocks.reduce((s,sk)=>s+calcStatus(sk,prices).pnl,0);
  const pct = inv ? (pnl/inv)*100 : 0;

  return (
    <div className="fadeIn">
      {confirm && (
        <div style={{ position:"fixed",inset:0,background:"rgba(0,0,0,0.75)",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center",padding:16 }}>
          <div style={{ background:"#030d1c",border:"1px solid #ef444450",borderRadius:10,padding:22,maxWidth:300,width:"100%" }}>
            <div style={{ color:"#e2e8f0",fontWeight:600,marginBottom:14 }}>{confirm.msg}</div>
            <div style={{ display:"flex",gap:10,justifyContent:"flex-end" }}>
              <button style={BS.cancel} onClick={()=>setConfirm(null)}>Cancel</button>
              <button style={BS.danger} onClick={()=>{ confirm.fn(); setConfirm(null); }}>Delete</button>
            </div>
          </div>
        </div>
      )}

      <div style={{ display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:12,flexWrap:"wrap",gap:8 }}>
        <div>
          <div style={{ fontSize:19,fontWeight:800,color:"#f1f5f9" }}>{group.name}</div>
          <div style={{ fontSize:11,color:"#475569" }}>₹{fmtN(group.budget)}/stock · {group.stocks.length} positions</div>
        </div>
        <div style={{ display:"flex",gap:8 }}>
          <button style={BS.primary} onClick={onAddStock}>+ Add Stock</button>
          <button style={BS.danger} onClick={()=>setConfirm({ msg:`Delete "${group.name}"?`, fn:onDelGroup })}>🗑 Delete</button>
        </div>
      </div>

      {/* Summary bar */}
      <div style={{ display:"flex",flexWrap:"wrap",background:"#030d1c",border:"1px solid #0a1e36",borderRadius:8,padding:"12px 14px",marginBottom:14 }}>
        {[
          ["Invested",  fmtRs(inv),    "#e2e8f0"],
          ["Curr Value",fmtRs(inv+pnl),"#e2e8f0"],
          ["P&L ₹",     fmtRs(pnl),   pnl>=0?"#22c55e":"#ef4444"],
          ["P&L %",     fmtPct(pct),  pct>=0?"#22c55e":"#ef4444"],
          ["Active",    group.stocks.filter(s=>!s.stopped).length, "#38bdf8"],
          ["Closed",    group.stocks.filter(s=>s.stopped).length,  "#f59e0b"],
        ].map(([l,v,c],i) => (
          <div key={i} style={{ flex:"1 1 80px",padding:"0 10px 4px 0",minWidth:75 }}>
            <div style={{ fontSize:9,color:"#475569",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:2 }}>{l}</div>
            <div style={{ fontSize:14,fontWeight:800,color:c }}>{v}</div>
          </div>
        ))}
      </div>

      {group.stocks.length===0 ? (
        <div style={{ textAlign:"center",padding:"40px 20px",color:"#475569" }}>
          <div style={{ fontSize:30,marginBottom:10 }}>🔍</div>
          <div style={{ marginBottom:14 }}>No stocks yet.</div>
          <button style={BS.primary} onClick={onAddStock}>+ Add First Stock</button>
        </div>
      ) : (
        <div style={{ overflowX:"auto",border:"1px solid #0a1e36",borderRadius:8 }}>
          <table style={{ width:"100%",borderCollapse:"collapse",background:"#030d1c",fontSize:12,minWidth:700 }}>
            <thead>
              <tr>
                {["Symbol","Entry ₹","Live ₹","Qty","SL","T1","T2","T3","Days","P&L ₹","P&L %","Status",""].map(h => (
                  <th key={h} style={{ padding:"8px 8px",fontSize:9,color:"#334155",letterSpacing:"0.1em",textTransform:"uppercase",textAlign:"left",borderBottom:"1px solid #0a1e36",background:"#020b18",whiteSpace:"nowrap" }}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {group.stocks.map(stock => {
                const info = calcStatus(stock, prices);
                const up   = info.curr >= stock.entryPrice;
                const isLive = prices[stock.symbol] && prices[stock.symbol] !== SEED[stock.symbol];
                return (
                  <tr key={stock.id} className="strow" style={{ borderBottom:"1px solid #0a1e3650",opacity:stock.stopped?0.65:1 }}>
                    <td style={{ padding:"8px 8px",whiteSpace:"nowrap" }}>
                      <div style={{ fontWeight:700,color:"#e2e8f0" }}>{stock.symbol}</div>
                      <div style={{ fontSize:9,color:"#475569" }}>{stock.sector}</div>
                    </td>
                    <td style={{ padding:"8px 8px",whiteSpace:"nowrap",color:"#f59e0b",fontWeight:600 }}>{fmtRs(stock.entryPrice)}</td>
                    <td style={{ padding:"8px 8px",fontWeight:700,whiteSpace:"nowrap" }}>
                      <span style={{ color:up?"#22c55e":"#ef4444" }}>{fmtRs(info.curr)}</span>
                      {!isLive && !stock.stopped && <span style={{ fontSize:8,color:"#334155",marginLeft:3 }}>~</span>}
                    </td>
                    <td style={{ padding:"8px 8px",whiteSpace:"nowrap" }}>{stock.qty}</td>
                    <td style={{ padding:"8px 8px",color:"#ef444499",whiteSpace:"nowrap" }}>{stock.stopLoss?fmtRs(stock.stopLoss):"—"}</td>
                    <td style={{ padding:"8px 8px",color:"#22c55e99",whiteSpace:"nowrap" }}>{stock.t1?fmtRs(stock.t1):"—"}</td>
                    <td style={{ padding:"8px 8px",color:"#3b82f699",whiteSpace:"nowrap" }}>{stock.t2?fmtRs(stock.t2):"—"}</td>
                    <td style={{ padding:"8px 8px",color:"#a855f799",whiteSpace:"nowrap" }}>{stock.t3?fmtRs(stock.t3):"—"}</td>
                    <td style={{ padding:"8px 8px",fontSize:10,color:"#475569",whiteSpace:"nowrap" }}>
                      {[stock.t1Days&&`T1:${stock.t1Days}d`,stock.t2Days&&`T2:${stock.t2Days}d`,stock.t3Days&&`T3:${stock.t3Days}d`].filter(Boolean).join(" ")||"—"}
                    </td>
                    <td style={{ padding:"8px 8px",fontWeight:800,color:info.pnl>=0?"#22c55e":"#ef4444",whiteSpace:"nowrap" }}>{fmtRs(info.pnl)}</td>
                    <td style={{ padding:"8px 8px",color:info.pct>=0?"#22c55e":"#ef4444",whiteSpace:"nowrap" }}>{fmtPct(info.pct)}</td>
                    <td style={{ padding:"8px 8px",whiteSpace:"nowrap" }}>
                      <span style={{ padding:"2px 6px",borderRadius:4,fontSize:10,fontWeight:700,color:info.color,background:`${info.color}15`,border:`1px solid ${info.color}40` }}>{info.status}</span>
                    </td>
                    <td style={{ padding:"8px 6px" }}>
                      <button className="delBtn" style={{ background:"transparent",border:"none",color:"#334155",cursor:"pointer",fontSize:13,padding:"2px 6px",borderRadius:4,transition:"color 0.15s" }}
                        onClick={()=>setConfirm({ msg:`Remove ${stock.symbol}?`, fn:()=>onDelStock(stock.id) })}>✕</button>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
          <div style={{ padding:"6px 10px",fontSize:9,color:"#334155",borderTop:"1px solid #0a1e36" }}>
            ~ = seed/cached price · Live prices update every 60s via Yahoo Finance
          </div>
        </div>
      )}
    </div>
  );
}

// ── Add Group Modal ───────────────────────────────────────────────
function AddGroupModal({ onAdd, onClose }) {
  const [name, setName]     = useState("");
  const [budget, setBudget] = useState("50000");
  return (
    <Modal title="Create New Group" onClose={onClose}>
      <Fld label="Group Name">
        <input style={BS.input} value={name} onChange={e=>setName(e.target.value)}
          placeholder="e.g. Banking Momentum Play" autoFocus
          onKeyDown={e=>e.key==="Enter"&&name.trim()&&onAdd({name:name.trim(),budget})}/>
      </Fld>
      <Fld label="Budget per Stock (₹)">
        <input style={BS.input} type="number" value={budget} onChange={e=>setBudget(e.target.value)} placeholder="50000"/>
      </Fld>
      <div style={{ display:"flex",gap:10,justifyContent:"flex-end",marginTop:18 }}>
        <button style={BS.cancel} onClick={onClose}>Cancel</button>
        <button style={{ ...BS.primary,opacity:name.trim()?1:0.4 }} disabled={!name.trim()} onClick={()=>onAdd({name:name.trim(),budget})}>Create Group</button>
      </div>
    </Modal>
  );
}

// ── Add Stock Modal ───────────────────────────────────────────────
function AddStockModal({ group, prices, onAdd, onClose }) {
  const [query,   setQuery]   = useState("");
  const [sel,     setSel]     = useState(null);
  const [sugs,    setSugs]    = useState([]);
  const [entryPx, setEntryPx] = useState("");
  const [sl,  setSl]  = useState("");
  const [t1,  setT1]  = useState(""); const [t1d, setT1d] = useState("");
  const [t2,  setT2]  = useState(""); const [t2d, setT2d] = useState("");
  const [t3,  setT3]  = useState(""); const [t3d, setT3d] = useState("");

  const livePrice = sel ? (prices[sel.s] ?? SEED[sel.s] ?? null) : null;
  const isLive    = sel && prices[sel.s] && prices[sel.s] !== SEED[sel.s];
  const effEntry  = entryPx && parseFloat(entryPx)>0 ? parseFloat(entryPx) : livePrice ?? 100;
  const qty       = Math.max(1, Math.floor(group.budget / effEntry));

  const onQuery = v => {
    setQuery(v); setSel(null); setEntryPx("");
    if (!v.trim()) { setSugs([]); return; }
    const q = v.toLowerCase();
    setSugs(STOCKS.filter(s => s.s.toLowerCase().includes(q) || s.n.toLowerCase().includes(q) || s.sec.toLowerCase().includes(q)).slice(0, 10));
  };

  const pick = s => {
    setSel(s); setQuery(s.s); setSugs([]);
    const lp = prices[s.s] ?? SEED[s.s];
    setEntryPx(lp ? String(lp) : "");
  };

  const ok = sel && entryPx && parseFloat(entryPx)>0 && (sl||t1||t2||t3);

  return (
    <Modal title={`Add Stock → ${group.name}`} onClose={onClose} wide>
      <Fld label={`Search ${STOCKS.length} Nifty 300 Stocks`}>
        <div style={{ position:"relative" }}>
          <input style={BS.input} value={query} onChange={e=>onQuery(e.target.value)}
            placeholder="Type symbol, company or sector… e.g. SBIN, Tata, Banking" autoFocus/>
          {sugs.length>0 && (
            <div style={{ position:"absolute",top:"100%",left:0,right:0,background:"#030d1c",border:"1px solid #0a1e36",borderRadius:6,zIndex:200,maxHeight:260,overflowY:"auto",boxShadow:"0 8px 32px rgba(0,0,0,0.8)" }}>
              {sugs.map(s => {
                const p = prices[s.s] ?? SEED[s.s];
                const live = prices[s.s] && prices[s.s] !== SEED[s.s];
                return (
                  <div key={s.s} className="sug" style={{ display:"flex",alignItems:"center",gap:6,padding:"10px 12px",borderBottom:"1px solid #0a1e3640",fontSize:12 }} onClick={()=>pick(s)}>
                    <span style={{ fontWeight:700,color:"#38bdf8",minWidth:90,flexShrink:0 }}>{s.s}</span>
                    <span style={{ color:"#94a3b8",flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap" }}>{s.n}</span>
                    <span style={{ fontSize:9,color:"#475569",padding:"1px 5px",background:"#0f2a44",borderRadius:3,flexShrink:0 }}>{s.sec}</span>
                    <span style={{ color:live?"#22c55e":"#f59e0b",fontWeight:700,flexShrink:0,minWidth:68,textAlign:"right" }}>
                      {p ? fmtRs(p) : "—"}
                      {live && <span style={{ fontSize:8,color:"#22c55e",marginLeft:2 }}>●</span>}
                    </span>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      </Fld>

      {sel && (
        <>
          <div style={{ background:"#020b18",border:"1px solid #0a1e36",borderRadius:8,padding:"10px 14px",marginBottom:12,display:"flex",flexWrap:"wrap",gap:16 }}>
            <div><div style={{ fontSize:9,color:"#475569",textTransform:"uppercase",marginBottom:2 }}>Company</div><div style={{ fontWeight:700,color:"#e2e8f0",fontSize:13 }}>{sel.n}</div></div>
            <div><div style={{ fontSize:9,color:"#475569",textTransform:"uppercase",marginBottom:2 }}>Sector</div><div style={{ fontWeight:700,color:"#94a3b8",fontSize:13 }}>{sel.sec}</div></div>
            {livePrice && (
              <div>
                <div style={{ fontSize:9,color:"#475569",textTransform:"uppercase",marginBottom:2 }}>
                  {isLive ? "🟢 Live Price (Yahoo)" : "⚠️ Cached/Seed Price"}
                </div>
                <div style={{ fontWeight:700,color:isLive?"#22c55e":"#f59e0b",fontSize:14 }}>{fmtRs(livePrice)}</div>
              </div>
            )}
            {entryPx && parseFloat(entryPx)>0 && (
              <>
                <div><div style={{ fontSize:9,color:"#475569",textTransform:"uppercase",marginBottom:2 }}>Qty (₹{(group.budget/1000).toFixed(0)}K budget)</div><div style={{ fontWeight:700,color:"#38bdf8",fontSize:13 }}>{qty} shares</div></div>
                <div><div style={{ fontSize:9,color:"#475569",textTransform:"uppercase",marginBottom:2 }}>Your Investment</div><div style={{ fontWeight:700,color:"#e2e8f0",fontSize:13 }}>{fmtRs(qty*parseFloat(entryPx))}</div></div>
              </>
            )}
          </div>

          {/* ★ Entry Price */}
          <div style={{ background:"#0c1a08",border:"2px solid #f59e0b",borderRadius:8,padding:"12px 14px",marginBottom:14 }}>
            <label style={{ display:"block",fontSize:11,color:"#f59e0b",fontWeight:800,letterSpacing:"0.06em",textTransform:"uppercase",marginBottom:6 }}>
              ★ Your Buy Price (₹) — Enter your actual purchase price
            </label>
            <input
              style={{ ...BS.input,fontSize:16,fontWeight:700,color:"#f59e0b",borderColor:"#f59e0b50",background:"#020b18",padding:"11px 14px" }}
              type="number" value={entryPx} onChange={e=>setEntryPx(e.target.value)}
              placeholder={livePrice ? `Live: ${livePrice} — enter your actual buy price` : "Enter buy price"}
            />
            {livePrice && entryPx && parseFloat(entryPx)>0 && (
              <div style={{ display:"flex",gap:16,marginTop:6,fontSize:11,flexWrap:"wrap" }}>
                <span style={{ color:"#64748b" }}>{isLive?"Live":"Cached"}: <span style={{ color:isLive?"#22c55e":"#f59e0b" }}>{fmtRs(livePrice)}</span></span>
                <span style={{ color:"#64748b" }}>Your entry: <span style={{ color:"#e2e8f0" }}>{fmtRs(parseFloat(entryPx))}</span></span>
                <span style={{ color:"#64748b" }}>Diff: <span style={{ color:parseFloat(entryPx)>livePrice?"#ef4444":"#22c55e" }}>{fmtPct(((parseFloat(entryPx)-livePrice)/livePrice)*100)}</span></span>
              </div>
            )}
          </div>
        </>
      )}

      {/* Target/SL grid */}
      <div style={{ display:"grid",gridTemplateColumns:"1fr 1fr",gap:10 }}>
        <div><label style={BS.label}>🔴 Stop Loss (₹)</label><input style={{ ...BS.input,borderColor:"#ef444440" }} type="number" value={sl} onChange={e=>setSl(e.target.value)} placeholder={effEntry?(effEntry*0.95).toFixed(0):"e.g. 790"}/></div>
        <div/>
        <div><label style={BS.label}>🟢 Target T1 (₹)</label><input style={{ ...BS.input,borderColor:"#22c55e40" }} type="number" value={t1} onChange={e=>setT1(e.target.value)} placeholder={effEntry?(effEntry*1.05).toFixed(0):"e.g. 875"}/></div>
        <div><label style={BS.label}>T1 Days</label><input style={BS.input} type="number" value={t1d} onChange={e=>setT1d(e.target.value)} placeholder="e.g. 7"/></div>
        <div><label style={BS.label}>🔵 Target T2 (₹)</label><input style={{ ...BS.input,borderColor:"#3b82f640" }} type="number" value={t2} onChange={e=>setT2(e.target.value)} placeholder={effEntry?(effEntry*1.10).toFixed(0):"e.g. 915"}/></div>
        <div><label style={BS.label}>T2 Days</label><input style={BS.input} type="number" value={t2d} onChange={e=>setT2d(e.target.value)} placeholder="e.g. 15"/></div>
        <div><label style={BS.label}>🟣 Target T3 (₹)</label><input style={{ ...BS.input,borderColor:"#a855f740" }} type="number" value={t3} onChange={e=>setT3(e.target.value)} placeholder={effEntry?(effEntry*1.20).toFixed(0):"e.g. 998"}/></div>
        <div><label style={BS.label}>T3 Days</label><input style={BS.input} type="number" value={t3d} onChange={e=>setT3d(e.target.value)} placeholder="e.g. 30"/></div>
      </div>

      {sel && !ok && (
        <div style={{ fontSize:11,color:"#f59e0b",marginTop:8,padding:"8px 10px",background:"#1a1500",borderRadius:6,border:"1px solid #f59e0b30" }}>
          {(!entryPx||parseFloat(entryPx)<=0) && "★ Enter your buy price. "}
          {entryPx&&parseFloat(entryPx)>0&&!sl&&!t1&&!t2&&!t3 && "Enter at least a Stop Loss or one Target."}
        </div>
      )}

      <div style={{ display:"flex",gap:10,justifyContent:"flex-end",marginTop:18 }}>
        <button style={BS.cancel} onClick={onClose}>Cancel</button>
        <button style={{ ...BS.primary,opacity:ok?1:0.4 }} disabled={!ok}
          onClick={()=>onAdd({
            symbol:sel.s, name:sel.n, sector:sel.sec,
            entryPrice: parseFloat(entryPx),
            stopLoss: sl?+sl:null, t1:t1?+t1:null, t2:t2?+t2:null, t3:t3?+t3:null,
            t1Days:t1d?+t1d:null, t2Days:t2d?+t2d:null, t3Days:t3d?+t3d:null,
          })}>
          Add {sel?.s}
        </button>
      </div>
    </Modal>
  );
}

// ── Shared atoms ──────────────────────────────────────────────────
function Modal({ children, title, onClose, wide }) {
  return (
    <div style={{ position:"fixed",inset:0,background:"rgba(2,11,24,0.9)",zIndex:100,display:"flex",alignItems:"center",justifyContent:"center",padding:16 }}
      onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div style={{ background:"#030d1c",border:"1px solid #0a1e36",borderRadius:12,width:"100%",maxWidth:wide?700:440,maxHeight:"94vh",overflowY:"auto" }}>
        <div style={{ display:"flex",justifyContent:"space-between",alignItems:"center",padding:"14px 18px",borderBottom:"1px solid #0a1e36" }}>
          <div style={{ fontWeight:700,color:"#e2e8f0",fontSize:14 }}>{title}</div>
          <button onClick={onClose} style={{ background:"transparent",border:"none",color:"#475569",cursor:"pointer",fontSize:18 }}>✕</button>
        </div>
        <div style={{ padding:18 }}>{children}</div>
      </div>
    </div>
  );
}
function Fld({ label, children }) {
  return <div style={{ marginBottom:12 }}><label style={BS.label}>{label}</label>{children}</div>;
}

const BS = {
  primary: { background:"#0ea5e9",color:"#fff",border:"none",padding:"9px 18px",borderRadius:6,cursor:"pointer",fontSize:12,fontWeight:700,fontFamily:"inherit",letterSpacing:"0.04em" },
  cancel:  { background:"transparent",color:"#64748b",border:"1px solid #1e3a5f",padding:"9px 18px",borderRadius:6,cursor:"pointer",fontSize:12,fontFamily:"inherit" },
  danger:  { background:"transparent",color:"#ef4444",border:"1px solid #ef444440",padding:"9px 18px",borderRadius:6,cursor:"pointer",fontSize:12,fontFamily:"inherit" },
  label:   { display:"block",fontSize:10,color:"#64748b",letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:6 },
  input:   { width:"100%",background:"#020b18",border:"1px solid #0a1e36",color:"#e2e8f0",padding:"9px 11px",borderRadius:6,fontSize:13,fontFamily:"'Courier New',monospace",transition:"border-color 0.2s",boxSizing:"border-box" },
};

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
<script>
  if("serviceWorker"in navigator){
    window.addEventListener("load",()=>{
      navigator.serviceWorker.register("sw.js").catch(()=>{});
    });
  }
</script>
</body>
</html>
